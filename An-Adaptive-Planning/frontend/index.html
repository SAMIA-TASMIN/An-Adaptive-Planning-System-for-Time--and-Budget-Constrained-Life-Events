<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>planly</title>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
        // Shows any error on the page itself, so a blank page is never silent.
        function showError(msg) {
            var box = document.getElementById('err')
            if (!box) {
                box = document.createElement('pre');
                box.id = 'err';
                document.body.appendChild(box)
            }
            box.style.cssText = 'white-space:pre-wrap;margin:16px;padding:16px;background:#fde4ea;color:#7a1f35;font:14px monospace;border-radius:12px'
            box.textContent += msg + '\n\n'
        }
        window.addEventListener('error', function(e) {
            showError('Error: ' + e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function(e) {
            showError('Promise error: ' + ((e.reason && e.reason.message) || e.reason))
        })
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
